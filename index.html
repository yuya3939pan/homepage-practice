<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>google風</title>
  <style>
    .header {
      display: flex;
      justify-content: space-between;
    }
    body {
      font-size: 14px;
      font-weight: normal;
      font-family: "Roboto", "Noto Sans JP", sans-serif;
    }
    .logo {
      margin-top: 120px;
      font-size: 64px;
      font-weight: 600;
      text-align: center;
      letter-spacing: -8px;
    }

    .search-box {
      margin-top: 20px;
      text-align: center;
    }
    
    input {
      width: 500px;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
    }

    input:hover {
      box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
    }

    button {
      margin-top: 20px;
      padding: 8px 16px;
      border: none;
      background-color: #f8f9fa;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      border: 1px solid #ccc;
    }

    .link {
      margin-top: 20px;
      padding: 0 20px;
      font-weight: 400;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="float: left;">
    <a class="link">Googleについて</a>
    <a class="link">ストア</a>
    </div>
    <div style="float: right;">
    <a class="link">Gmail</a>
    <a class="link">画像</a>
    </div>
  </div>
  <div class="logo">
    <span  style="color: #4285F4;">G</span>
    <span  style="color: #EA4335;">o</span>
    <span  style="color: #FBBC05;">o</span>
    <span  style="color: #4285F4;">g</span>
    <span  style="color: #34A853;">l</span>
    <span  style="color: #EA4335;">e</span>
  </div>
  <div class="search-box">
    <input type="text" placeholder="検索...">
  </div>
  <div style="text-align: center;">
    <button>Google検索</button>
    <button>I'm Feeling Lucky</button>
  </div>
</body>
</html>
